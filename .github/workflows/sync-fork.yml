name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'  # 每天 0 点（UTC）自动运行
  workflow_dispatch:      # 支持手动点击按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          upstream_repository: ChatGPTNextWeb/NextChat  # 例如: octocat/Hello-World
          upstream_branch: main                   # 上游分支名
          target_branch: main                     # 你 Fork 的分支名
          github_token: ${{ secrets.GITHUB_TOKEN }}
